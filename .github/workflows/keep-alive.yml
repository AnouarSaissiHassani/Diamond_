name: Keep Supabase Active

on:
  schedule:
    # Runs at 00:00 every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual test trigger from GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint / Supabase
        run: |
          # 1. Ping deployed web app if APP_URL secret is set (e.g. https://my-diamond-clinic.vercel.app)
          if [ -n "${{ secrets.APP_URL }}" ]; then
            echo "Pinging ${{ secrets.APP_URL }}/api/health"
            curl -s -f "${{ secrets.APP_URL }}/api/health" || true
          fi

          # 2. Ping Supabase REST API directly if SUPABASE_ANON_KEY is set
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Pinging Supabase REST API"
            curl -s -o /dev/null -w "Supabase HTTP status: %{http_code}\n" \
              -X GET "https://nkeptrybomnprnzbwhip.supabase.co/rest/v1/" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
          fi
